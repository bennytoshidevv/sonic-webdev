<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My orders | Sonic</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="styles/responsive.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { calamansi: '#F2C230', chili: '#C8341F', ink: '#17251C', mist: '#EEF3EC', navyblue: '#010736' }, fontFamily: { display: ['Bricolage Grotesque', 'sans-serif'], sans: ['Figtree', 'sans-serif'] } } } }
    </script>
</head>
<body class="font-sans bg-white text-navyblue flex min-h-screen flex-col">
    <!-- NAVBAR: copy this exact block into every page (change only the active link) -->
    <header class="sticky top-0 z-50 bg-blue-950 text-white">
        <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <a href="index.html" class="font-display text-3xl font-extrabold p-5">Sonic<span class="text-yellow-500">.</span></a>
            <!-- later: hamburger button (id="menu-btn") for mobile -->
            <ul class="flex flex-wrap items-center gap-1 text-sm font-medium">
                <li><a href="index.html" class="px-3 py-2 rounded-full hover:bg-white/10">Home</a></li>
                <li><a href="menu.html" class="px-3 py-2 rounded-full hover:bg-white/10">Menu</a></li>
                <li><a href="cart.html" class="px-3 py-2 rounded-full hover:bg-white/10">Cart (0)</a></li>
                <li><a href="track.html" class="px-3 py-2 rounded-full hover:bg-white/10">Track order</a></li>
                <li><a href="orders.html" class="px-3 py-2 rounded-full bg-calamansi text-ink">My orders</a></li>
                <li><a href="contact.html" class="px-3 py-2 rounded-full hover:bg-white/10">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="flex-1">
<section class="max-w-6xl mx-auto px-4 mt-10">
            <h1 class="font-display text-3xl md:text-4xl font-extrabold">My orders</h1>
            <!-- FILTER (JS): show only .order cards that match the clicked status -->
            <div id="order-filters" class="mt-4 flex flex-wrap gap-2 text-sm" role="group" aria-label="Filter orders by status">
                <button type="button" data-order-filter="All" class="bg-blue-950 text-white px-4 py-2 rounded-full" aria-pressed="true">All</button>
                <button type="button" data-order-filter="On the way" class="bg-blue-50 px-4 py-2 rounded-full" aria-pressed="false">On the way</button>
                <button type="button" data-order-filter="Delivered" class="bg-blue-50 px-4 py-2 rounded-full" aria-pressed="false">Delivered</button>
                <button type="button" data-order-filter="Cancelled" class="bg-blue-50 px-4 py-2 rounded-full" aria-pressed="false">Cancelled</button>
            </div>
            <!-- ORDERS (JS): render from the orders array saved in localStorage -->
            <div id="order-list" class="mt-6 space-y-4 max-w-3xl"></div>
            <p id="orders-empty" class="hidden mt-6 max-w-3xl rounded-2xl bg-blue-50 p-6 text-center text-sm text-navyblue/70" role="status"></p>
        </section>
    </main>
    <footer class="bg-blue-950 text-white/70 mt-auto">
        <div class="max-w-6xl mx-auto px-4 py-8 flex flex-wrap justify-between gap-4 text-sm">
            <p><span class="font-display text-white font-bold">Sonic.</span> Food delivery based in Sipocot, Camarines Sur.</p>
        </div>
    </footer>
    <script src="scripts/common.js"></script>
    <script src="scripts/orders.js"></script>
</body>
</html>
